<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dither Light · 图片处理器</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: #07050f;
    color: #f7f3ff;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }

  dither-light {
    flex: 1;
    min-height: 0;
  }

  #bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: rgba(8, 7, 18, 0.9);
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }

  #bar label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: rgba(247, 243, 255, 0.7);
  }

  select, button {
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.08);
    color: #f7f3ff;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  select option { color: #16111f; }

  button:hover, select:hover { background: rgba(255, 255, 255, 0.16); }

  #download { background: #ffc07a; border-color: transparent; color: #16111f; font-weight: 600; }
  #download:hover { background: #ffcf9c; }

  #status { margin-left: auto; font-size: 13px; color: rgba(247, 243, 255, 0.55); }
</style>
</head>
<body>
  <dither-light id="fx" matrix="8" grid="5" contrast="1.35" ambient="0.22"></dither-light>

  <div id="bar">
    <button id="pick" type="button">选择图片…</button>
    <input id="file" type="file" accept="image/*" hidden>

    <label>预设
      <select id="preset">
        <option value="shadow" selected>白底黑点</option>
        <option value="highlight">黑底白点</option>
        <option value="duotone">双色调</option>
      </select>
    </label>

    <label>Bayer
      <select id="matrix">
        <option value="2">2×2</option>
        <option value="3">3×3</option>
        <option value="4">4×4</option>
        <option value="8" selected>8×8</option>
      </select>
    </label>

    <label>网点
      <select id="grid">
        <option value="3">细腻 3px</option>
        <option value="5" selected>标准 5px</option>
        <option value="8">粗犷 8px</option>
        <option value="12">海报 12px</option>
      </select>
    </label>

    <button id="download" type="button" disabled>下载 PNG</button>
    <span id="status">请选择或拖入一张图片</span>
  </div>

  <script src="../dither-light.js"></script>
  <script>
    const fx = document.getElementById("fx");
    const fileEl = document.getElementById("file");
    const downloadEl = document.getElementById("download");
    const statusEl = document.getElementById("status");

    document.getElementById("pick").addEventListener("click", () => fileEl.click());
    fileEl.addEventListener("change", () => {
      if (fileEl.files[0]) fx.setImage(fileEl.files[0]);
    });
    downloadEl.addEventListener("click", () => fx.downloadPNG());

    for (const id of ["preset", "matrix", "grid"]) {
      document.getElementById(id).addEventListener("change", (event) => {
        fx.setAttribute(id, event.target.value);
      });
    }

    fx.addEventListener("dither-load", (event) => {
      downloadEl.disabled = false;
      statusEl.textContent = event.detail.name + "（" + event.detail.width + "×" + event.detail.height + "）";
    });
    fx.addEventListener("dither-error", () => {
      statusEl.textContent = "图片读取失败，请换一张试试";
    });

    window.addEventListener("dragover", (event) => event.preventDefault());
    window.addEventListener("drop", (event) => {
      event.preventDefault();
      const file = event.dataTransfer && event.dataTransfer.files[0];
      if (file && file.type.startsWith("image/")) fx.setImage(file);
    });
  </script>
</body>
</html>
