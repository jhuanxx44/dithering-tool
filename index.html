<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dither Light · 1-bit 抖动渲染器</title>
<style>
  :root {
    color-scheme: dark;
    /* 3D 模式渲染的是亮底画面，所以 UI 走深色文字 + 浅色面板，
       不能沿用旧渐变模式那套浅色文字，否则会糊在白底上看不见 */
    --panel-bg: rgba(255, 255, 255, 0.82);
    --panel-border: rgba(20, 16, 32, 0.14);
    --text: #16111f;
    --muted: rgba(22, 17, 31, 0.62);
    --accent: #d9832b;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    /* 与 3D 模式的亮底画面一致，避免加载瞬间闪一下深色 */
    background: #f4f4f7;
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  dither-light {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  header {
    position: fixed;
    top: 28px;
    left: 28px;
    z-index: 2;
    pointer-events: none;
  }

  header h1 {
    margin: 0;
    font-size: clamp(26px, 5vw, 64px);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }

  header p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.02em;
  }

  #controls {
    position: fixed;
    left: 24px;
    bottom: 24px;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
    width: min(360px, calc(100vw - 48px));
    padding: 16px;
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    background: var(--panel-bg);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(16px) saturate(1.15);
    -webkit-backdrop-filter: blur(16px) saturate(1.15);
  }

  .control {
    min-width: 0;
  }

  label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.03em;
  }

  label span.value {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  select,
  input[type="range"] {
    width: 100%;
  }

  select {
    appearance: none;
    padding: 9px 10px;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: rgba(20, 16, 32, 0.06);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  select option {
    color: #16111f;
  }

  input[type="range"] {
    appearance: none;
    -webkit-appearance: none;
    height: 22px;
    background: transparent;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), rgba(20, 16, 32, 0.18));
    opacity: 0.9;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    margin-top: -6px;
    border: 2px solid rgba(255, 255, 255, 0.95);
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }

  input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.22);
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
  }

  /* 图片模式下面板的折叠 / 展开动效 */
  #controls {
    transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: left bottom;
  }

  body.controls-collapsed #controls {
    opacity: 0;
    transform: translateY(20px) scale(0.92);
    pointer-events: none;
  }

  #controls-toggle {
    position: fixed;
    left: 24px;
    bottom: 24px;
    z-index: 3;
    display: grid;
    place-items: center;
    flex: none;
    width: 46px;
    height: 46px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    opacity: 0;
    transform: scale(0.4) rotate(-120deg);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  body.controls-collapsed #controls-toggle {
    opacity: 1;
    transform: scale(1) rotate(0deg);
    pointer-events: auto;
  }

  body.controls-collapsed #controls-toggle:hover {
    transform: scale(1.12) rotate(0deg);
  }

  .span-2 {
    grid-column: 1 / -1;
  }

  .image-actions {
    display: flex;
    gap: 8px;
  }

  button {
    flex: 1;
    padding: 9px 10px;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: rgba(20, 16, 32, 0.06);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  button:hover {
    background: rgba(255, 255, 255, 0.16);
  }

  /* 未加载图片时，「选择图片…」作为主操作高亮 */
  #pick-image.primary {
    border-color: transparent;
    background: var(--accent);
    color: #16111f;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(255, 192, 122, 0.28);
  }

  #pick-image.primary:hover {
    background: #ffcf9c;
    box-shadow: 0 8px 24px rgba(255, 192, 122, 0.38);
  }

  button[hidden] {
    display: none;
  }

  select:disabled,
  input[type="range"]:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  @media (max-width: 560px) {
    #controls {
      grid-template-columns: 1fr;
    }

    header {
      top: 20px;
      left: 20px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #controls,
    #controls-toggle {
      transition: none;
    }
  }
</style>
</head>
<body>
  <dither-light id="fx" scene="blob" grid="4"></dither-light>

  <button id="controls-toggle" type="button" aria-label="展开参数面板">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16111f" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="4" y1="7" x2="20" y2="7"></line>
      <circle cx="9" cy="7" r="2.4" fill="#16111f" stroke="none"></circle>
      <line x1="4" y1="12" x2="20" y2="12"></line>
      <circle cx="15" cy="12" r="2.4" fill="#16111f" stroke="none"></circle>
      <line x1="4" y1="17" x2="20" y2="17"></line>
      <circle cx="7" cy="17" r="2.4" fill="#16111f" stroke="none"></circle>
    </svg>
  </button>

  <header>
    <h1>Dither<br>Light</h1>
    <p>1-bit 抖动渲染器 · SDF 实时造型</p>
  </header>

  <form id="controls" aria-label="抖动光影参数">
    <div class="control">
      <label for="preset">Preset</label>
      <select id="preset">
        <option value="shadow" selected>Shadow · multiply</option>
        <option value="highlight">Highlight · screen</option>
        <option value="duotone">Duotone · overlay</option>
      </select>
    </div>

    <div class="control">
      <label for="scene">造型</label>
      <select id="scene">
        <option value="blob" selected>Blob · 融合球</option>
        <option value="sphere">球体</option>
        <option value="torus">圆环</option>
        <option value="cut">立方挖球</option>
        <option value="gem">宝石</option>
        <option value="off">渐变光影（非 3D）</option>
      </select>
    </div>

    <div class="control">
      <label for="source">光源</label>
      <select id="source">
        <option value="auto" selected>自动游走</option>
        <option value="pointer">跟随指针</option>
      </select>
    </div>

    <div class="control">
      <label for="matrix">Bayer 矩阵</label>
      <select id="matrix">
        <option value="2">2 × 2</option>
        <option value="3">3 × 3</option>
        <option value="4">4 × 4</option>
        <option value="8" selected>8 × 8</option>
      </select>
    </div>

    <div class="control">
      <label for="speed">速度 <span class="value" id="speed-value">1.00</span></label>
      <input id="speed" type="range" min="0" max="3" step="0.05" value="1">
    </div>

    <div class="control">
      <label for="grid">网点 <span class="value" id="grid-value">5 px</span></label>
      <input id="grid" type="range" min="2" max="14" step="0.5" value="4">
    </div>

    <div class="control">
      <label for="contrast">对比度 <span class="value" id="contrast-value">1.35</span></label>
      <input id="contrast" type="range" min="0.2" max="3" step="0.05" value="1.35">
    </div>

    <div class="control">
      <label for="ambient">环境光 <span class="value" id="ambient-value">0.22</span></label>
      <input id="ambient" type="range" min="0" max="0.7" step="0.02" value="0.22">
    </div>

    <div class="control span-2">
      <label>本地图片（可拖入页面） <span class="value" id="image-name">未加载</span></label>
      <div class="image-actions">
        <button type="button" id="pick-image">选择图片…</button>
        <button type="button" id="download-image" hidden>下载 PNG</button>
        <button type="button" id="clear-image" hidden>清除</button>
      </div>
      <input id="file-input" type="file" accept="image/*" hidden>
    </div>
  </form>

  <script src="dither-light.js"></script>
  <script>
    (() => {
      "use strict";

      const fx = document.getElementById("fx");
      const controlsEl = document.getElementById("controls");
      const controlsToggleEl = document.getElementById("controls-toggle");

      const presetEl = document.getElementById("preset");
      const sceneEl = document.getElementById("scene");
      const sourceEl = document.getElementById("source");
      const matrixEl = document.getElementById("matrix");
      const speedEl = document.getElementById("speed");
      const gridEl = document.getElementById("grid");
      const contrastEl = document.getElementById("contrast");
      const ambientEl = document.getElementById("ambient");

      const speedValue = document.getElementById("speed-value");
      const gridValue = document.getElementById("grid-value");
      const contrastValue = document.getElementById("contrast-value");
      const ambientValue = document.getElementById("ambient-value");

      const pickImageEl = document.getElementById("pick-image");
      const clearImageEl = document.getElementById("clear-image");
      const downloadImageEl = document.getElementById("download-image");
      const fileInputEl = document.getElementById("file-input");
      const imageNameEl = document.getElementById("image-name");

      let imageLoaded = false;

      function updateValueLabels() {
        speedValue.textContent = parseFloat(speedEl.value).toFixed(2);
        gridValue.textContent = parseFloat(gridEl.value).toFixed(1) + " px";
        contrastValue.textContent = parseFloat(contrastEl.value).toFixed(2);
        ambientValue.textContent = parseFloat(ambientEl.value).toFixed(2);
      }

      // 折叠状态机：仅图片模式下生效，指针离开面板片刻后折叠成小圆钮
      let collapseTimer = null;

      function setControlsCollapsed(collapsed) {
        document.body.classList.toggle("controls-collapsed", collapsed);
      }

      function scheduleCollapse() {
        clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => {
          if (!imageLoaded) return;
          if (controlsEl.matches(":hover")) return;
          // 下拉框展开或滑块拖动中（焦点在控件上）则不折叠
          const active = document.activeElement;
          if (controlsEl.contains(active) && (active.tagName === "SELECT" || active.type === "range")) return;
          setControlsCollapsed(true);
        }, 800);
      }

      function expandControls() {
        clearTimeout(collapseTimer);
        setControlsCollapsed(false);
      }

      function updateImageUI(name) {
        imageNameEl.textContent = imageLoaded ? name : "未加载";
        clearImageEl.hidden = !imageLoaded;
        downloadImageEl.hidden = !imageLoaded;
        pickImageEl.classList.toggle("primary", !imageLoaded);
        pickImageEl.textContent = imageLoaded ? "更换图片…" : "选择图片…";
        sceneEl.disabled = imageLoaded;
        sourceEl.disabled = imageLoaded;
        speedEl.disabled = imageLoaded;
        if (imageLoaded) {
          scheduleCollapse();
        } else {
          expandControls();
        }
      }

      function bindEvents() {
        // 面板控件 → 组件属性
        presetEl.addEventListener("change", () => fx.setAttribute("preset", presetEl.value));
        sceneEl.addEventListener("change", () => fx.setAttribute("scene", sceneEl.value));
        sourceEl.addEventListener("change", () => fx.setAttribute("light", sourceEl.value));
        matrixEl.addEventListener("change", () => fx.setAttribute("matrix", matrixEl.value));
        speedEl.addEventListener("input", () => {
          fx.setAttribute("speed", speedEl.value);
          updateValueLabels();
        });
        gridEl.addEventListener("input", () => {
          fx.setAttribute("grid", gridEl.value);
          updateValueLabels();
        });
        contrastEl.addEventListener("input", () => {
          fx.setAttribute("contrast", contrastEl.value);
          updateValueLabels();
        });
        ambientEl.addEventListener("input", () => {
          fx.setAttribute("ambient", ambientEl.value);
          updateValueLabels();
        });

        // 组件事件 → 面板状态
        fx.addEventListener("dither-load", (event) => {
          imageLoaded = true;
          updateImageUI(event.detail.name);
        });
        fx.addEventListener("dither-clear", () => {
          imageLoaded = false;
          fileInputEl.value = "";
          updateImageUI();
        });
        fx.addEventListener("dither-error", () => {
          imageNameEl.textContent = "图片读取失败";
        });

        // 图片操作
        pickImageEl.addEventListener("click", () => fileInputEl.click());
        fileInputEl.addEventListener("change", () => {
          if (fileInputEl.files[0]) fx.setImage(fileInputEl.files[0]);
        });
        clearImageEl.addEventListener("click", () => fx.clearImage());
        downloadImageEl.addEventListener("click", () => fx.downloadPNG());

        window.addEventListener("dragover", (event) => {
          event.preventDefault();
        });
        window.addEventListener("drop", (event) => {
          event.preventDefault();
          const file = event.dataTransfer && event.dataTransfer.files[0];
          if (file && file.type.startsWith("image/")) fx.setImage(file);
        });

        // 折叠交互
        controlsEl.addEventListener("pointerenter", expandControls);
        controlsEl.addEventListener("pointerleave", scheduleCollapse);
        controlsToggleEl.addEventListener("pointerenter", expandControls);
        controlsToggleEl.addEventListener("click", expandControls);
      }

      updateValueLabels();
      updateImageUI();
      bindEvents();
    })();
  </script>
</body>
</html>
