<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dithering Light · Gradient Shadow</title>
<style>
  :root {
    color-scheme: dark;
    --panel-bg: rgba(8, 7, 18, 0.58);
    --panel-border: rgba(255, 255, 255, 0.16);
    --text: #f7f3ff;
    --muted: rgba(247, 243, 255, 0.68);
    --accent: #ffc07a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    background: #07050f;
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #gradient {
    position: fixed;
    inset: -12%;
    z-index: 0;
    background:
      radial-gradient(52% 52% at 18% 26%, rgba(255, 199, 118, 0.95) 0%, rgba(255, 199, 118, 0) 70%),
      radial-gradient(50% 50% at 82% 22%, rgba(255, 108, 158, 0.85) 0%, rgba(255, 108, 158, 0) 70%),
      radial-gradient(62% 62% at 50% 112%, rgba(122, 92, 255, 0.90) 0%, rgba(122, 92, 255, 0) 72%),
      linear-gradient(155deg, #07050f 0%, #2a1240 48%, #06152b 100%);
    filter: saturate(1.08) contrast(1.04);
    transform-origin: 50% 50%;
    animation: drift 20s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(-3%, 2%, 0) scale(1.12); }
  }

  #dither {
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  header {
    position: fixed;
    top: 28px;
    left: 28px;
    z-index: 2;
    pointer-events: none;
  }

  header h1 {
    margin: 0;
    font-size: clamp(26px, 5vw, 64px);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }

  header p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.02em;
  }

  #controls {
    position: fixed;
    left: 24px;
    bottom: 24px;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
    width: min(360px, calc(100vw - 48px));
    padding: 16px;
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    background: var(--panel-bg);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(16px) saturate(1.15);
    -webkit-backdrop-filter: blur(16px) saturate(1.15);
  }

  .control {
    min-width: 0;
  }

  label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.03em;
  }

  label span.value {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  select,
  input[type="range"] {
    width: 100%;
  }

  select {
    appearance: none;
    padding: 9px 10px;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  select option {
    color: #16111f;
  }

  input[type="range"] {
    appearance: none;
    -webkit-appearance: none;
    height: 22px;
    background: transparent;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), rgba(255, 255, 255, 0.22));
    opacity: 0.9;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    margin-top: -6px;
    border: 2px solid rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }

  input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.22);
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
  }

  /* 图片模式下面板的折叠 / 展开动效 */
  #controls {
    transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: left bottom;
  }

  body.controls-collapsed #controls {
    opacity: 0;
    transform: translateY(20px) scale(0.92);
    pointer-events: none;
  }

  #controls-toggle {
    position: fixed;
    left: 24px;
    bottom: 24px;
    z-index: 3;
    display: grid;
    place-items: center;
    flex: none;
    width: 46px;
    height: 46px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    opacity: 0;
    transform: scale(0.4) rotate(-120deg);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  body.controls-collapsed #controls-toggle {
    opacity: 1;
    transform: scale(1) rotate(0deg);
    pointer-events: auto;
  }

  body.controls-collapsed #controls-toggle:hover {
    transform: scale(1.12) rotate(0deg);
  }

  .span-2 {
    grid-column: 1 / -1;
  }

  .image-actions {
    display: flex;
    gap: 8px;
  }

  button {
    flex: 1;
    padding: 9px 10px;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  button:hover {
    background: rgba(255, 255, 255, 0.16);
  }

  /* 未加载图片时，「选择图片…」作为主操作高亮 */
  #pick-image.primary {
    border-color: transparent;
    background: var(--accent);
    color: #16111f;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(255, 192, 122, 0.28);
  }

  #pick-image.primary:hover {
    background: #ffcf9c;
    box-shadow: 0 8px 24px rgba(255, 192, 122, 0.38);
  }

  button[hidden] {
    display: none;
  }

  select:disabled,
  input[type="range"]:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  @media (max-width: 560px) {
    #controls {
      grid-template-columns: 1fr;
    }

    header {
      top: 20px;
      left: 20px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #gradient {
      animation: none;
    }

    #controls,
    #controls-toggle {
      transition: none;
    }
  }
</style>
</head>
<body>
  <div id="gradient" aria-hidden="true"></div>
  <canvas id="dither" role="img" aria-label="动态有序抖动的光影图层，覆盖在漂移渐变之上"></canvas>

  <header>
    <h1>Dither<br>Light</h1>
    <p>Bayer 有序抖动 · 渐变底层</p>
  </header>

  <button id="controls-toggle" type="button" aria-label="展开参数面板">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16111f" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="4" y1="7" x2="20" y2="7"></line>
      <circle cx="9" cy="7" r="2.4" fill="#16111f" stroke="none"></circle>
      <line x1="4" y1="12" x2="20" y2="12"></line>
      <circle cx="15" cy="12" r="2.4" fill="#16111f" stroke="none"></circle>
      <line x1="4" y1="17" x2="20" y2="17"></line>
      <circle cx="7" cy="17" r="2.4" fill="#16111f" stroke="none"></circle>
    </svg>
  </button>

  <form id="controls" aria-label="抖动光影参数">
    <div class="control">
      <label for="preset">Preset</label>
      <select id="preset">
        <option value="shadow" selected>Shadow · multiply</option>
        <option value="highlight">Highlight · screen</option>
        <option value="duotone">Duotone · overlay</option>
      </select>
    </div>

    <div class="control">
      <label for="source">光源</label>
      <select id="source">
        <option value="auto" selected>自动游走</option>
        <option value="pointer">跟随指针</option>
      </select>
    </div>

    <div class="control">
      <label for="matrix">Bayer 矩阵</label>
      <select id="matrix">
        <option value="2">2 × 2</option>
        <option value="3">3 × 3</option>
        <option value="4">4 × 4</option>
        <option value="8" selected>8 × 8</option>
      </select>
    </div>

    <div class="control">
      <label for="speed">速度 <span class="value" id="speed-value">1.00</span></label>
      <input id="speed" type="range" min="0" max="3" step="0.05" value="1">
    </div>

    <div class="control">
      <label for="grid">网点 <span class="value" id="grid-value">5 px</span></label>
      <input id="grid" type="range" min="2" max="14" step="0.5" value="5">
    </div>

    <div class="control">
      <label for="contrast">对比度 <span class="value" id="contrast-value">1.35</span></label>
      <input id="contrast" type="range" min="0.2" max="3" step="0.05" value="1.35">
    </div>

    <div class="control">
      <label for="ambient">环境光 <span class="value" id="ambient-value">0.22</span></label>
      <input id="ambient" type="range" min="0" max="0.7" step="0.02" value="0.22">
    </div>

    <div class="control span-2">
      <label>本地图片（可拖入页面） <span class="value" id="image-name">未加载</span></label>
      <div class="image-actions">
        <button type="button" id="pick-image">选择图片…</button>
        <button type="button" id="download-image" hidden>下载 PNG</button>
        <button type="button" id="clear-image" hidden>清除</button>
      </div>
      <input id="file-input" type="file" accept="image/*" hidden>
    </div>
  </form>

  <script>
    (() => {
      "use strict";

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const canvas = document.getElementById("dither");
      const ctx = canvas.getContext("2d", { alpha: true });

      const presetEl = document.getElementById("preset");
      const sourceEl = document.getElementById("source");
      const matrixEl = document.getElementById("matrix");
      const speedEl = document.getElementById("speed");
      const gridEl = document.getElementById("grid");
      const contrastEl = document.getElementById("contrast");
      const ambientEl = document.getElementById("ambient");

      const speedValue = document.getElementById("speed-value");
      const gridValue = document.getElementById("grid-value");
      const contrastValue = document.getElementById("contrast-value");
      const ambientValue = document.getElementById("ambient-value");

      const controlsEl = document.getElementById("controls");
      const controlsToggleEl = document.getElementById("controls-toggle");
      const pickImageEl = document.getElementById("pick-image");
      const clearImageEl = document.getElementById("clear-image");
      const downloadImageEl = document.getElementById("download-image");
      const fileInputEl = document.getElementById("file-input");
      const imageNameEl = document.getElementById("image-name");

      // 图片模式状态：sourceImage 非空时，用图片亮度取代光场作为抖动输入
      let sourceImage = null;
      let imageFileName = "";
      let imageDirty = true;
      let lumaCache = null;
      let lumaKey = "";

      const matrixCache = new Map();
      const off = document.createElement("canvas");
      const offCtx = off.getContext("2d", { alpha: true });

      let cssWidth = 0;
      let cssHeight = 0;
      let dpr = 1;

      const pointer = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        active: false
      };

      function buildBayer(n) {
        if (matrixCache.has(n)) return matrixCache.get(n);

        let matrix;
        if (n === 1) {
          matrix = [[0]];
        } else if (n === 3) {
          matrix = [
            [0, 7, 3],
            [6, 5, 2],
            [4, 1, 8]
          ];
        } else {
          const half = n / 2;
          const prev = buildBayer(half);
          const offset = [[0, 2], [3, 1]];
          matrix = Array.from({ length: n }, () => Array(n).fill(0));

          for (let y = 0; y < n; y += 1) {
            for (let x = 0; x < n; x += 1) {
              matrix[y][x] = prev[y % half][x % half] * 4 +
                offset[Math.floor(y / half)][Math.floor(x / half)];
            }
          }
        }

        matrixCache.set(n, matrix);
        return matrix;
      }

      function resize() {
        cssWidth = window.innerWidth;
        cssHeight = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(cssWidth * dpr);
        canvas.height = Math.round(cssHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        imageDirty = true;
      }

      function clamp01(value) {
        return Math.max(0, Math.min(1, value));
      }

      function smoothstep(edge0, edge1, x) {
        const t = clamp01((x - edge0) / (edge1 - edge0));
        return t * t * (3 - 2 * t);
      }

      function glow(cx, cy, radius, px, py) {
        return smoothstep(radius, 0, Math.hypot(px - cx, py - cy));
      }

      function makeLightState(time) {
        const minSide = Math.min(cssWidth, cssHeight);

        if (sourceEl.value === "pointer") {
          const targetX = pointer.active ? pointer.x : cssWidth * 0.5;
          const targetY = pointer.active ? pointer.y : cssHeight * 0.5;
          return {
            type: "pointer",
            x: targetX,
            y: targetY,
            r: minSide * 0.56,
            ax: cssWidth - targetX,
            ay: cssHeight - targetY,
            ar: minSide * 0.30
          };
        }

        return {
          type: "auto",
          x1: cssWidth * (0.5 + 0.30 * Math.sin(time * 0.23)),
          y1: cssHeight * (0.48 + 0.26 * Math.cos(time * 0.17)),
          r1: minSide * (0.52 + 0.08 * Math.sin(time * 0.31)),
          x2: cssWidth * (0.72 + 0.16 * Math.cos(time * 0.13)),
          y2: cssHeight * (0.22 + 0.16 * Math.sin(time * 0.11)),
          r2: minSide * 0.26
        };
      }

      function lightAt(px, py, state) {
        if (state.type === "pointer") {
          return Math.max(
            glow(state.x, state.y, state.r, px, py),
            glow(state.ax, state.ay, state.ar, px, py) * 0.48
          );
        }

        return Math.max(
          glow(state.x1, state.y1, state.r1, px, py),
          glow(state.x2, state.y2, state.r2, px, py) * 0.72
        );
      }

      // 将图片按 cover 方式采样为 cols×rows 的亮度场（带缓存，仅尺寸变化时重采样）
      function sampleLuminance(cols, rows) {
        const key = cols + "x" + rows;
        if (lumaCache && lumaKey === key) return lumaCache;

        if (off.width !== cols || off.height !== rows) {
          off.width = cols;
          off.height = rows;
        }

        const scale = Math.max(cols / sourceImage.width, rows / sourceImage.height);
        const drawWidth = sourceImage.width * scale;
        const drawHeight = sourceImage.height * scale;
        offCtx.drawImage(
          sourceImage,
          (cols - drawWidth) / 2,
          (rows - drawHeight) / 2,
          drawWidth,
          drawHeight
        );

        const pixels = offCtx.getImageData(0, 0, cols, rows).data;
        const luma = new Float32Array(cols * rows);
        for (let i = 0; i < luma.length; i += 1) {
          const p = i * 4;
          luma[i] = (0.2126 * pixels[p] + 0.7152 * pixels[p + 1] + 0.0722 * pixels[p + 2]) / 255;
        }

        lumaCache = luma;
        lumaKey = key;
        return luma;
      }

      function drawImageMode() {
        const preset = presetEl.value;
        const n = parseInt(matrixEl.value, 10);
        const bayer = buildBayer(n);
        const thresholdScale = n * n;
        const grid = parseFloat(gridEl.value);
        const ambient = parseFloat(ambientEl.value);
        const contrast = parseFloat(contrastEl.value);

        const cols = Math.max(1, Math.ceil(cssWidth / grid));
        const rows = Math.max(1, Math.ceil(cssHeight / grid));
        const luma = sampleLuminance(cols, rows);

        // 预设映射：白底黑点 / 黑底白点 / 双色调（深紫 + 暖橙）
        let dot = [0, 0, 0];
        let paper = [255, 255, 255];
        let invert = false;
        if (preset === "highlight") {
          dot = [255, 255, 255];
          paper = [0, 0, 0];
        } else if (preset === "duotone") {
          dot = [255, 192, 122];
          paper = [22, 16, 31];
          invert = true;
        }

        const image = offCtx.createImageData(cols, rows);
        const data = image.data;

        for (let gy = 0; gy < rows; gy += 1) {
          const by = gy % n;
          for (let gx = 0; gx < cols; gx += 1) {
            const cell = gy * cols + gx;
            const value = clamp01(0.5 + ((ambient + (1 - ambient) * luma[cell]) - 0.5) * contrast);
            const threshold = (bayer[by][gx % n] + 0.5) / thresholdScale;
            const isDot = invert ? value >= threshold : value < threshold;
            const color = isDot ? dot : paper;
            const index = cell * 4;
            data[index] = color[0];
            data[index + 1] = color[1];
            data[index + 2] = color[2];
            data[index + 3] = 255;
          }
        }

        offCtx.putImageData(image, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(off, 0, 0, cssWidth, cssHeight);
      }

      function draw(time) {
        if (sourceImage) {
          drawImageMode();
          return;
        }

        const preset = presetEl.value;
        const n = parseInt(matrixEl.value, 10);
        const bayer = buildBayer(n);
        const thresholdScale = n * n;
        const grid = parseFloat(gridEl.value);
        const ambient = parseFloat(ambientEl.value);
        const contrast = parseFloat(contrastEl.value);
        const lightState = makeLightState(time);

        const cols = Math.max(1, Math.ceil(cssWidth / grid));
        const rows = Math.max(1, Math.ceil(cssHeight / grid));

        if (off.width !== cols || off.height !== rows) {
          off.width = cols;
          off.height = rows;
        }

        const image = offCtx.createImageData(cols, rows);
        const data = image.data;

        for (let gy = 0; gy < rows; gy += 1) {
          const py = (gy + 0.5) * grid;
          const by = gy % n;

          for (let gx = 0; gx < cols; gx += 1) {
            const px = (gx + 0.5) * grid;
            const light = lightAt(px, py, lightState);
            const value = clamp01(0.5 + ((ambient + (1 - ambient) * light) - 0.5) * contrast);
            const threshold = (bayer[by][gx % n] + 0.5) / thresholdScale;
            const index = (gy * cols + gx) * 4;

            let red = 0;
            let green = 0;
            let blue = 0;
            let alpha = 0;

            if (preset === "shadow") {
              if (value < threshold) alpha = 255;
            } else if (preset === "highlight") {
              if (value > threshold) {
                red = 255;
                green = 255;
                blue = 255;
                alpha = 255;
              }
            } else {
              if (value < threshold) {
                alpha = 255;
              } else if (value > threshold) {
                red = 255;
                green = 255;
                blue = 255;
                alpha = 255;
              }
            }

            data[index] = red;
            data[index + 1] = green;
            data[index + 2] = blue;
            data[index + 3] = alpha;
          }
        }

        offCtx.putImageData(image, 0, 0);
        ctx.clearRect(0, 0, cssWidth, cssHeight);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(off, 0, 0, cssWidth, cssHeight);
      }

      function updatePreset() {
        const preset = presetEl.value;
        canvas.style.mixBlendMode = sourceImage ? "normal" :
          preset === "highlight" ? "screen" :
          preset === "duotone" ? "overlay" : "multiply";
      }

      // 折叠状态机：仅图片模式下生效，指针离开面板片刻后折叠成小圆钮
      let collapseTimer = null;

      function setControlsCollapsed(collapsed) {
        document.body.classList.toggle("controls-collapsed", collapsed);
      }

      function scheduleCollapse() {
        clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => {
          if (!sourceImage) return;
          // 仍悬停在面板上，或面板内有控件持有焦点（如下拉框展开中）则不折叠
          if (controlsEl.matches(":hover")) return;
          // 下拉框展开或滑块拖动中（焦点在控件上）则不折叠
          const active = document.activeElement;
          if (controlsEl.contains(active) && (active.tagName === "SELECT" || active.type === "range")) return;
          setControlsCollapsed(true);
        }, 800);
      }

      function expandControls() {
        clearTimeout(collapseTimer);
        setControlsCollapsed(false);
      }

      function updateImageUI() {
        const hasImage = Boolean(sourceImage);
        imageNameEl.textContent = hasImage ? imageFileName : "未加载";
        clearImageEl.hidden = !hasImage;
        downloadImageEl.hidden = !hasImage;
        pickImageEl.classList.toggle("primary", !hasImage);
        pickImageEl.textContent = hasImage ? "更换图片…" : "选择图片…";
        sourceEl.disabled = hasImage;
        speedEl.disabled = hasImage;
        if (hasImage) {
          scheduleCollapse();
        } else {
          expandControls();
        }
      }

      function loadImageFile(file) {
        if (!file || !file.type.startsWith("image/")) return;

        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          sourceImage = img;
          imageFileName = file.name;
          lumaKey = "";
          imageDirty = true;
          updateImageUI();
          updatePreset();
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          imageNameEl.textContent = "图片读取失败";
        };
        img.src = url;
      }

      function clearImage() {
        sourceImage = null;
        imageFileName = "";
        lumaCache = null;
        lumaKey = "";
        fileInputEl.value = "";
        updateImageUI();
        updatePreset();
      }

      function downloadImage() {
        canvas.toBlob((blob) => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          const base = imageFileName ? imageFileName.replace(/\.[^.]+$/, "") : "image";
          link.download = "dithered-" + base + ".png";
          link.click();
          URL.revokeObjectURL(url);
        }, "image/png");
      }

      function updateValueLabels() {
        speedValue.textContent = parseFloat(speedEl.value).toFixed(2);
        gridValue.textContent = parseFloat(gridEl.value).toFixed(1) + " px";
        contrastValue.textContent = parseFloat(contrastEl.value).toFixed(2);
        ambientValue.textContent = parseFloat(ambientEl.value).toFixed(2);
      }

      function frame(now) {
        if (sourceImage) {
          // 图片是静态的，仅在参数或尺寸变化时重绘
          if (imageDirty) {
            imageDirty = false;
            drawImageMode();
          }
        } else {
          const speed = reducedMotion ? 0 : parseFloat(speedEl.value);
          draw(now * 0.001 * speed);
        }
        requestAnimationFrame(frame);
      }

      function bindEvents() {
        window.addEventListener("resize", resize);

        document.addEventListener("pointermove", (event) => {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          pointer.active = true;
        });

        document.addEventListener("pointerout", (event) => {
          if (!event.relatedTarget) pointer.active = false;
        });

        presetEl.addEventListener("change", () => {
          imageDirty = true;
          updatePreset();
        });
        matrixEl.addEventListener("change", () => {
          imageDirty = true;
        });
        speedEl.addEventListener("input", updateValueLabels);
        gridEl.addEventListener("input", () => {
          imageDirty = true;
          updateValueLabels();
        });
        contrastEl.addEventListener("input", () => {
          imageDirty = true;
          updateValueLabels();
        });
        ambientEl.addEventListener("input", () => {
          imageDirty = true;
          updateValueLabels();
        });

        pickImageEl.addEventListener("click", () => fileInputEl.click());
        fileInputEl.addEventListener("change", () => {
          loadImageFile(fileInputEl.files[0]);
        });
        clearImageEl.addEventListener("click", clearImage);
        downloadImageEl.addEventListener("click", downloadImage);

        controlsEl.addEventListener("pointerenter", expandControls);
        controlsEl.addEventListener("pointerleave", scheduleCollapse);
        controlsToggleEl.addEventListener("pointerenter", expandControls);
        controlsToggleEl.addEventListener("click", expandControls);

        window.addEventListener("dragover", (event) => {
          event.preventDefault();
        });
        window.addEventListener("drop", (event) => {
          event.preventDefault();
          if (event.dataTransfer && event.dataTransfer.files.length) {
            loadImageFile(event.dataTransfer.files[0]);
          }
        });
      }

      resize();
      updatePreset();
      updateValueLabels();
      updateImageUI();
      bindEvents();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
